[workspace]
members = ["crates/domain", "crates/application", "crates/gameplay"]
exclude = [
    "experiments/p0-egui",
    "experiments/p0-media",
    "experiments/p0-preview-contract",
    "experiments/p0-wasapi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
