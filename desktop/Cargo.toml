[workspace]
members = ["audio", "rendering", "preview", "infrastructure", "ui", "host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
skin-editor-domain = { path = "../crates/domain" }
skin-editor-application = { path = "../crates/application" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Reduce dependency debug metadata in desktop dev/test builds. Keep project
# code fully debuggable, including the two local non-workspace packages.
[profile.dev.package."*"]
debug = 0

[profile.dev.package.skin-editor-domain]
debug = 2

[profile.dev.package.skin-editor-application]
debug = 2

[profile.test.package."*"]
debug = 0

[profile.test.package.skin-editor-domain]
debug = 2

[profile.test.package.skin-editor-application]
debug = 2
